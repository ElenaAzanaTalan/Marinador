<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marinador</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
background:#dfe8ff;
display:flex;
justify-content:center;
padding:20px;
}
.app{
width:390px;
min-height:840px;
background:#f7f9ff;
border-radius:30px;
overflow:hidden;
box-shadow:0 20px 40px rgba(0,0,0,.25);
position:relative;
}
header{
background:linear-gradient(135deg,#5B7CFF,#7ED6FF);
color:#fff;
padding:18px;
display:flex;
align-items:center;
gap:15px;
}
header img{
width:82px;
height:82px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
}
header h1{font-size:28px}
header p{font-size:13px}
.hero{padding:18px}
.hero h2{color:#2F4FB8}
#pantalla{padding:0 15px 95px}
.card{
background:white;
border-radius:18px;
padding:14px;
margin-bottom:12px;
box-shadow:0 4px 10px rgba(0,0,0,.08);
}
.badge{
display:inline-block;
background:#E8EEFF;
color:#3454C8;
padding:4px 10px;
border-radius:20px;
font-size:11px;
margin-bottom:8px;
}
.fab{
position:absolute;
left:50%;
bottom:78px;
transform:translateX(-50%);
width:86%;
padding:15px;
border:none;
border-radius:30px;
background:#5577FF;
color:white;
font-size:18px;
}
nav{
position:absolute;
bottom:0;
width:100%;
height:70px;
background:white;
border-top:1px solid #ddd;
display:flex;
}
nav button{
flex:1;
border:none;
background:none;
font-size:11px;
color:#555;
}
nav span{
display:block;
font-size:22px;
}
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
justify-content:center;
align-items:center;
}
.box{
background:white;
width:92%;
max-width:360px;
border-radius:22px;
padding:18px;
max-height:90vh;
overflow:auto;
}
label{
display:block;
margin-top:8px;
font-size:13px;
color:#555;
}
input,select,textarea{
width:100%;
padding:10px;
border-radius:10px;
border:1px solid #D8E2FF;
}
textarea{height:70px}
.row{
display:flex;
gap:8px;
margin-top:12px;
}
.row button{
flex:1;
padding:11px;
border:none;
border-radius:10px;
}
.ok{
background:#5577FF;
color:white;
}
.del{
background:#FFDADA;
}
.grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
}
.dia{
background:white;
border-radius:10px;
padding:8px;
text-align:center;
cursor:pointer;
min-height:46px;
box-shadow:0 2px 6px rgba(0,0,0,.06);
}
.punto{
width:7px;
height:7px;
background:#FF4F81;
border-radius:50%;
margin:4px auto 0;
}
.resumen{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:14px;
}
.caja{
background:white;
border-radius:16px;
padding:10px;
text-align:center;
box-shadow:0 3px 8px rgba(0,0,0,.08);
}
.caja h2{
color:#3454C8;
font-size:24px;
}
.linea{
height:8px;
background:#E8EEFF;
border-radius:8px;
overflow:hidden;
margin:8px 0 14px;
}
.progreso{
height:100%;
background:#5B7CFF;
width:0%;
}
</style>
</head>

<body>

<div class="app">

<header>
<img src="marina.jpg">
<div>
<h1>💙 Marinador</h1>
<p id="fecha"></p>
</div>
</header>

<div class="hero">
<h2>Hola Marina 🌸</h2>
<p>Tu agenda inteligente</p>
</div>

<div id="pantalla"></div>

<button class="fab" onclick="abrir()">✨ Añadir</button>

<nav>
<button onclick="inicio()">
<span>🏠</span>Hoy
</button>

<button onclick="calendario()">
<span>📅</span>Calendario
</button>

<button onclick="diario()">
<span>💬</span>Diario
</button>

<button onclick="historico()">
<span>📊</span>Histórico
</button>
</nav>

</div>

<div class="modal" id="modal">
<div class="box">

<h2>Marinador 💙</h2>

<label>Tipo</label>

<select id="tipo" onchange="preguntas()">
<option value="">Selecciona...</option>
<option>📚 Deberes</option>
<option>📝 Examen</option>
<option>⚽ Partido</option>
<option>🏃 Entrenamiento</option>
<option>👭 Quedada</option>
<option>🩺 Médico</option>
<option>✈️ Vacaciones</option>
</select>

<label>Fecha</label>
<input type="date" id="f">

<label>Hora</label>
<input type="time" id="h">

<div id="campos"></div>

<div class="row">
<button class="ok" onclick="guardar()">Guardar</button>
<button onclick="cerrar()">Cancelar</button>
</div>

</div>
</div>

<script>

const pantalla=document.getElementById("pantalla");

let eventos=JSON.parse(localStorage.getItem("marinador"))||[];

let diarioData=JSON.parse(localStorage.getItem("diario"))||[];

let edit=-1;

const hoy=new Date();

document.getElementById("fecha").innerText=
hoy.toLocaleDateString("es-ES",{
weekday:"long",
day:"numeric",
month:"long"
});

function abrir(i=-1){

edit=i;

modal.style.display="flex";

f.value=new Date().toISOString().split("T")[0];

h.value="18:00";

tipo.value="";

campos.innerHTML="";

if(i>=0){

const e=eventos[i];

tipo.value=e.tipo;
f.value=e.fecha;
h.value=e.hora;

preguntas();

Object.values(e.data).forEach((v,n)=>{

const c=document.getElementById("c"+n);

if(c)c.value=v;

});

}

}

function cerrar(){

modal.style.display="none";

}

function preguntas(){

let t=tipo.value;

if(t=="📚 Deberes")
campos.innerHTML=`
<label>¿De qué asignatura?</label>
<input id=c0>

<label>¿Qué deberes tienes?</label>
<input id=c1>

<label>¿Cuándo lo entregas?</label>
<input type=date id=c2>`;

if(t=="📝 Examen")
campos.innerHTML=`
<label>¿De qué asignatura?</label>
<input id=c0>

<label>Nota del examen</label>
<input id=c1>`;

if(t=="⚽ Partido")
campos.innerHTML=`
<label>¿Dónde es?</label>
<input id=c0>

<label>¿Contra quién juegas?</label>
<input id=c1>

<label>¿Qué resultado has tenido?</label>
<input id=c2>`;

if(t=="🏃 Entrenamiento")
campos.innerHTML=`
<label>¿Dónde entrenas?</label>
<input id=c0>`;

if(t=="👭 Quedada")
campos.innerHTML=`
<label>¿Con quién has quedado?</label>
<input id=c0>

<label>¿Dónde vais?</label>
<input id=c1>`;

if(t=="🩺 Médico")
campos.innerHTML=`
<label>¿Dónde es?</label>
<input id=c0>

<label>¿Qué especialista es?</label>
<input id=c1>`;

if(t=="✈️ Vacaciones")
campos.innerHTML=`
<label>¿Dónde te vas?</label>
<input id=c0>

<label>¿Cuándo vuelves?</label>
<input type=date id=c1>`;

}

function guardar(){

let d={};

document.querySelectorAll("#campos input").forEach((x,i)=>{

d["v"+i]=x.value;

});

const e={
tipo:tipo.value,
fecha:f.value,
hora:h.value,
data:d
};

if(edit>=0)
eventos[edit]=e;
else
eventos.push(e);

localStorage.setItem("marinador",JSON.stringify(eventos));

cerrar();

inicio();

}

function texto(e){

let d=e.data||{};

switch(e.tipo){

case "📚 Deberes":
return `<b>${d.v0||""}</b><br>${d.v1||""}<br>📅 ${d.v2||""}`;

case "📝 Examen":
return `<b>${d.v0||""}</b><br>⭐ ${d.v1||"Pendiente"}`;

case "⚽ Partido":
return `📍 ${d.v0||""}<br>⚽ ${d.v1||""}<br>🏆 ${d.v2||""}`;

case "🏃 Entrenamiento":
return `📍 ${d.v0||""}`;

case "👭 Quedada":
return `👤 ${d.v0||""}<br>📍 ${d.v1||""}`;

case "🩺 Médico":
return `🏥 ${d.v0||""}<br>👨‍⚕️ ${d.v1||""}`;

case "✈️ Vacaciones":
return `🌍 ${d.v0||""}<br>↩️ ${d.v1||""}`;

}

return "";

}
function pintar(lista,indices){

pantalla.innerHTML="";

if(lista.length==0){

pantalla.innerHTML=`
<div class="card">
<h3>🌸 Día libre</h3>
<p>No tienes actividades.</p>
</div>`;

return;
}

lista.forEach((e,n)=>{

let real=indices?indices[n]:eventos.indexOf(e);

pantalla.innerHTML+=`
<div class="card">

<div class="badge">${e.tipo}</div>

<h3>${e.fecha} · ${e.hora}</h3>

<p>${texto(e)}</p>

<div class="row">

<button onclick="abrir(${real})">
✏️ Editar
</button>

<button class="del" onclick="borrar(${real})">
🗑️
</button>

</div>

</div>`;

});

}

function borrar(i){

if(confirm("¿Eliminar este evento?")){

eventos.splice(i,1);

localStorage.setItem("marinador",JSON.stringify(eventos));

inicio();

}

}

function inicio(){

const hoyISO=new Date().toISOString().split("T")[0];

let lista=[];
let ind=[];

eventos.forEach((e,i)=>{

if(e.fecha===hoyISO){

lista.push(e);
ind.push(i);

}

});

pintar(lista,ind);

}

function calendario(){

const y=hoy.getFullYear();
const m=hoy.getMonth();

const primer=new Date(y,m,1);

const offset=(primer.getDay()+6)%7;

const diasMes=new Date(y,m+1,0).getDate();

const meses=[
"Enero","Febrero","Marzo","Abril","Mayo","Junio",
"Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"
];

let html=`
<h2 style="color:#3454C8;margin-bottom:12px">
📅 ${meses[m]} ${y}
</h2>

<div class="grid">`;

["L","M","M","J","V","S","D"].forEach(d=>{

html+=`
<div style="text-align:center;font-weight:bold;color:#666">
${d}
</div>`;

});

for(let i=0;i<offset;i++)html+="<div></div>";

for(let d=1;d<=diasMes;d++){

const fecha=
`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

const tiene=
eventos.some(e=>e.fecha===fecha);

html+=`
<div class="dia" onclick="verDia('${fecha}')">

${d}

${tiene?'<div class="punto"></div>':""}

</div>`;

}

html+=`</div><div id="detalle" style="margin-top:18px"></div>`;

pantalla.innerHTML=html;

}

function verDia(fecha){

let lista=[];
let ind=[];

eventos.forEach((e,i)=>{

if(e.fecha===fecha){

lista.push(e);
ind.push(i);

}

});

let html=`<h3 style="margin-bottom:10px">${fecha}</h3>`;

if(lista.length==0){

html+=`
<div class="card">
No tienes actividades 🌸
</div>`;

}else{

lista.forEach((e,n)=>{

html+=`
<div class="card">

<div class="badge">${e.tipo}</div>

<h3>${e.hora}</h3>

<p>${texto(e)}</p>

<div class="row">

<button onclick="abrir(${ind[n]})">
✏️ Editar
</button>

<button class="del" onclick="borrar(${ind[n]})">
🗑️
</button>

</div>

</div>`;

});

}

document.getElementById("detalle").innerHTML=html;

}

function diario(){

const hoyISO=new Date().toISOString().split("T")[0];

let d=
diarioData.find(x=>x.fecha===hoyISO)
||
{lectura:"",estado:"😊",nota:""};

pantalla.innerHTML=`

<div class="card">

<h3>📖 ¿Cuánto has leído hoy?</h3>

<input id="l" value="${d.lectura}" placeholder="30">

<div class="linea">
<div class="progreso" style="width:${Math.min((Number(d.lectura)||0)/30*100,100)}%"></div>
</div>

<p style="font-size:12px;color:#666">
Objetivo diario: 30 minutos
</p>

<h3 style="margin-top:14px">
😊 ¿Qué tal te encuentras?
</h3>

<select id="s">
<option ${d.estado=="😢"?"selected":""}>😢</option>
<option ${d.estado=="😕"?"selected":""}>😕</option>
<option ${d.estado=="😐"?"selected":""}>😐</option>
<option ${d.estado=="😊"?"selected":""}>😊</option>
<option ${d.estado=="😍"?"selected":""}>😍</option>
</select>

<h3 style="margin-top:14px">
💬 Cuéntame tu día
</h3>

<textarea id="n">${d.nota}</textarea>

<button class="ok"
style="width:100%;margin-top:14px"
onclick="guardarDiario()">

Guardar mi día

</button>

</div>`;

}

function guardarDiario(){

const hoyISO=new Date().toISOString().split("T")[0];

diarioData=
diarioData.filter(x=>x.fecha!==hoyISO);

diarioData.push({
fecha:hoyISO,
lectura:l.value,
estado:s.value,
nota:n.value
});

localStorage.setItem(
"diario",
JSON.stringify(diarioData)
);

alert("Diario guardado 💙");

}

function historico(){

let total=0;

diarioData.forEach(d=>{

total+=Number(d.lectura)||0;

});

const media=
diarioData.length?
Math.round(total/diarioData.length):0;

pantalla.innerHTML=`

<h2 style="color:#3454C8;margin-bottom:12px">
📊 Histórico
</h2>

<div class="resumen">

<div class="caja">
<h2>${total}</h2>
<p style="font-size:11px">Minutos</p>
</div>

<div class="caja">
<h2>${media}</h2>
<p style="font-size:11px">Media</p>
</div>

<div class="caja">
<h2>${diarioData.length}</h2>
<p style="font-size:11px">Días</p>
</div>

</div>

<h3 style="margin-bottom:8px">
📖 Lectura y estado
</h3>

`;

const orden=[...diarioData].sort((a,b)=>b.fecha.localeCompare(a.fecha));

orden.forEach(d=>{

pantalla.innerHTML+=`

<div class="card">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:6px;
">

<b>${d.fecha}</b>

<span style="font-size:26px">
${d.estado}
</span>

</div>

<p>📖 ${d.lectura||0} minutos</p>

<p style="margin-top:8px;color:#555">
${d.nota||""}
</p>

</div>`;

});

if(orden.length===0){

pantalla.innerHTML+=`
<div class="card">
Todavía no hay ningún día guardado.
</div>`;

}

}

inicio();

</script>

</body>
</html>
