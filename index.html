<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marinador</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#dfe8ff;display:flex;justify-content:center;padding:20px}
.phone{width:390px;background:#f8fbff;border-radius:30px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.2);min-height:820px;position:relative}
header{background:linear-gradient(135deg,#5b7cff,#7ed6ff);color:#fff;padding:20px;display:flex;align-items:center;gap:15px}
header img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:4px solid #fff}
.hero{padding:18px}
.hero h2{color:#3050c5}
#lista{padding:0 15px 90px}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.tipo{display:inline-block;background:#e8eeff;color:#3454c8;padding:4px 10px;border-radius:20px;font-size:11px;margin-bottom:8px}
.fab{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);width:86%;background:#5577ff;color:#fff;border:none;padding:15px;border-radius:30px;font-size:17px}
nav{position:absolute;bottom:0;width:100%;height:70px;background:#fff;border-top:1px solid #ddd;display:flex}
nav button{flex:1;border:none;background:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;justify-content:center;align-items:center}
.box{background:#fff;width:92%;max-width:360px;border-radius:22px;padding:18px}
label{display:block;margin-top:10px;font-size:13px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #d8e2ff}
.q{margin-top:10px}
.btns{display:flex;gap:8px;margin-top:15px}
.btns button{flex:1;padding:11px;border:none;border-radius:10px}
.save{background:#5577ff;color:#fff}
</style>
</head>
<body>

<div class="phone">

<header>
<img src="marina.jpg" onerror="this.src='https://placehold.co/300x300?text=Marina'">
<div>
<h1>💙 Marinador</h1>
<div id="hoy"></div>
</div>
</header>

<div class="hero">
<h2>Hola Marina 🌸</h2>
<p>¿Qué tienes hoy?</p>
</div>

<div id="lista"></div>

<button class="fab" onclick="abrir()">✨ Añadir</button>

<nav>
<button onclick="mostrarHoy()">🏠</button>
<button onclick="mostrarTodo()">📅</button>
<button onclick="mostrarHistorico()">📊</button>
</nav>

</div>

<div class="modal" id="modal">
<div class="box">

<h2>Marinador 💙</h2>

<label>Tipo de actividad</label>
<select id="tipo" onchange="cambiarPreguntas()">
<option value="">Selecciona...</option>
<option>📚 Deberes</option>
<option>📝 Examen</option>
<option>⚽ Partido</option>
<option>🏃 Entrenamiento</option>
<option>👭 Quedada</option>
<option>🩺 Médico</option>
<option>✈️ Vacaciones</option>
</select>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Hora</label>
<input type="time" id="hora">

<div id="preguntas"></div>

<div class="btns">
<button class="save" onclick="guardar()">Guardar</button>
<button onclick="cerrar()">Cancelar</button>
</div>

</div>
</div>

<script>
const hoy=new Date();
document.getElementById("hoy").innerText=
hoy.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});

let datos=JSON.parse(localStorage.getItem("marinador"))||[];

const preguntas=document.getElementById("preguntas");
const lista=document.getElementById("lista");

function abrir(){
modal.style.display="flex";
fecha.value=new Date().toISOString().split("T")[0];
}

function cerrar(){
modal.style.display="none";
tipo.value="";
preguntas.innerHTML="";
}

function cambiarPreguntas(){

const t=tipo.value;

if(t=="📚 Deberes"){
preguntas.innerHTML=`
<div class=q><label>¿De qué asignatura?</label><input id=a1></div>
<div class=q><label>¿Qué deberes tienes?</label><input id=a2></div>
<div class=q><label>¿Cuándo lo tienes que entregar?</label><input type=date id=a3></div>`;
}

if(t=="📝 Examen"){
preguntas.innerHTML=`
<div class=q><label>¿De qué asignatura?</label><input id=a1></div>
<div class=q><label>¿Qué nota has sacado?</label><input id=a2 placeholder="8,5"></div>`;
}

if(t=="⚽ Partido"){
preguntas.innerHTML=`
<div class=q><label>¿Dónde es?</label><input id=a1></div>
<div class=q><label>¿Contra quién juegas?</label><input id=a2></div>
<div class=q><label>¿Qué resultado has tenido?</label><input id=a3 placeholder="3-1"></div>`;
}

if(t=="🏃 Entrenamiento"){
preguntas.innerHTML=`
<div class=q><label>¿Dónde entrenas?</label><input id=a1></div>`;
}

if(t=="👭 Quedada"){
preguntas.innerHTML=`
<div class=q><label>¿Con quién has quedado?</label><input id=a1></div>
<div class=q><label>¿Dónde vais?</label><input id=a2></div>`;
}

if(t=="🩺 Médico"){
preguntas.innerHTML=`
<div class=q><label>¿Dónde es?</label><input id=a1></div>
<div class=q><label>¿Qué especialista es?</label><input id=a2></div>`;
}

if(t=="✈️ Vacaciones"){
preguntas.innerHTML=`
<div class=q><label>¿Dónde te vas?</label><input id=a1></div>
<div class=q><label>¿Cuándo vuelves?</label><input type=date id=a2></div>`;
}

}

function guardar(){

const ev={
tipo:tipo.value,
fecha:fecha.value,
hora:hora.value,
x1:document.getElementById("a1")?.value||"",
x2:document.getElementById("a2")?.value||"",
x3:document.getElementById("a3")?.value||""
};

datos.push(ev);
localStorage.setItem("marinador",JSON.stringify(datos));

cerrar();
mostrarHoy();
}

function pintar(listaEventos){

lista.innerHTML="";

if(listaEventos.length==0){
lista.innerHTML="<div class='card'><h3>🌸 No hay actividades</h3></div>";
return;
}

listaEventos.forEach(e=>{

let texto="";

switch(e.tipo){

case "📚 Deberes":
texto=`<b>${e.x1}</b><br>${e.x2}<br>📅 Entrega: ${e.x3}`;
break;

case "📝 Examen":
texto=`<b>${e.x1}</b><br>⭐ Nota: ${e.x2||"Pendiente"}`;
break;

case "⚽ Partido":
texto=`📍 ${e.x1}<br>⚽ vs ${e.x2}<br>🏆 ${e.x3||"Pendiente"}`;
break;

case "🏃 Entrenamiento":
texto=`📍 ${e.x1}`;
break;

case "👭 Quedada":
texto=`👤 ${e.x1}<br>📍 ${e.x2}`;
break;

case "🩺 Médico":
texto=`🏥 ${e.x1}<br>👨‍⚕️ ${e.x2}`;
break;

case "✈️ Vacaciones":
texto=`🌍 ${e.x1}<br>↩️ Vuelta: ${e.x2}`;
break;

}

lista.innerHTML+=`
<div class="card">
<div class="tipo">${e.tipo}</div>
<h3>${e.fecha} · ${e.hora}</h3>
<p>${texto}</p>
</div>`;

});

}

function mostrarHoy(){

const hoyISO=new Date().toISOString().split("T")[0];
pintar(datos.filter(x=>x.fecha==hoyISO));

}

function mostrarTodo(){

const orden=[...datos].sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
pintar(orden);

}

function mostrarHistorico(){

const orden=[...datos].sort((a,b)=>(b.fecha+b.hora).localeCompare(a.fecha+b.hora));
pintar(orden);

}

mostrarHoy();
</script>

</body>
</html>
